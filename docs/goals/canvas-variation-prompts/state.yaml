version: 2

goal:
  title: "Canvas Variation Prompts and Codex Handoff"
  slug: "canvas-variation-prompts"
  kind: specific
  tranche: "Implement and prove the full persisted branch/reroll prompt vertical slice, then establish the safe direct-handoff boundary."
  status: done
  oracle:
    signal: "A verified checkout-dev browser and CLI/API walkthrough persists distinct branch/reroll prompts across reload and exposes them to profile-scoped Codex generation planning."
    cadence: "after each Worker package and at final audit"
    final_proof: "Focused storage/API/CLI/UI tests, full relevant gates, and desktop/narrow browser evidence mapped to both branch and reroll flows."
  intake:
    original_request: "Start fresh from GitHub main and add exact persisted prompts to Canvas branch/reroll selections, visible on nodes and available to Codex; explore direct Canvas-to-Codex generation."
    interpreted_outcome: "Canvas becomes the durable instruction surface for image variations and Codex consumes the same saved intent without re-entry."
    input_shape: specific
    audience: "Lineage users and Codex image-generation sessions"
    authority: requested
    proof_type: demo
    completion_proof: "A user can author, edit, persist, revisit, and consume variation prompts for branch and reroll targets, with a truthfully safe direct-handoff disposition."
    likely_misfire: "A browser-only prompt editor or opaque dispatch button that is disconnected from Lineage's profile-scoped generation contract."
    blind_spots_considered:
      - "Prompt belongs to a branch request versus a reroll attempt."
      - "Existing promptless selections remain valid."
      - "Edit, clear, reload, and stale-selection behavior."
      - "Desktop and narrow-screen usability."
      - "Codex may not be open or addressable from a web app."
      - "Direct work initiation requires explicit consent and inspectable status."
    existing_plan_facts:
      - "Leave landing and walkthrough branches untouched."
      - "Base the new branch directly on freshly fetched origin/main."
      - "Reuse existing branch/reroll selection and image-generation planning contracts."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/canvas-variation-prompts/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/canvas-variation-prompts"


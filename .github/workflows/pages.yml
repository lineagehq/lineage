name: Deploy public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: node --test scripts/docs-check.test.mjs scripts/prepare-pages.test.mjs
      - name: Build documentation for its public base path
        env:
          LINEAGE_DOCS_BASE: /docs/
          LINEAGE_DOCS_SITE: https://lineage.neonwatty.com
        run: npm run docs:check
      - name: Build landing page for its public base path
        env:
          LINEAGE_WEB_BASE: /
        run: npm run build:web
      - run: npm run pages:prepare
      - run: test -f dist/pages/index.html && test -f dist/pages/docs/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

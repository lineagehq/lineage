    status: done
    reasoning_hint: high
    objective: "Map the existing Canvas branch/reroll selection, persistence, node projection, CLI/agent handoff, and image-generation planning path; determine whether a safe direct Canvas-to-Codex transport already exists."
    inputs:
      - "src/web"
      - "src/server.ts and server modules"
      - "src/cli"
      - "database schema and migrations"
      - "tests and e2e flows covering selection, reroll, branching, and generation"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Use concrete file, symbol, route, table, and command evidence."
      - "Distinguish Codex-readable handoff from autonomous task dispatch."
    expected_output:
      - "End-to-end current-state map"
      - "Compatible persistence model options"
      - "Direct-send feasibility finding"
      - "Largest safe vertical Worker package with exact allowed_files and verify commands"
    receipt:
      result: done
      summary: "The durable substrate already exists: branch selections persist `asset_selections.notes` and mirror them into pending iterate-task instructions; rerolls persist `asset_reroll_requests.notes` and mirror them into pending reroll-task instructions. Snapshots expose `selection_note` and `reroll_request.notes`; CLI selection packets and reroll lists expose them to Codex. The UX labels branch text as rationale, captures no reroll text at selection time, and node cards show only badges. Generation planning still requires a separately re-entered global prompt. Direct dispatch does not exist: handoffs are deliberately `codex-handoff` with `live_generation:false` and `external_services:false`; durable claimable Lineage tasks are available, but Lineage has no safe address/wake transport for a Codex desktop task."
      evidence:
        - "src/server/assetLineage.ts:updateSelectedAsset"
        - "src/server/assetLineage.ts:markLineageRerollRequest"
        - "src/server/assetLineageTasks.ts:upsertLineageTask"
        - "src/server/lineageSelectionPacket.ts:getLineageSelectionPacketV3"
        - "src/shared/lineageSelectionPacketTypes.ts:LineageSelectionPacketV3"
        - "src/web/components/LineageView.tsx:selectNextBase"
        - "src/web/components/LineageView.tsx:markReroll"
        - "src/web/components/LineageSidePanel.tsx:LineageSidePanel"
        - "src/web/components/LineageAssetNode.tsx:AssetNode"
        - "src/web/components/LineageGenerationSheet.tsx:LineageGenerationSheet"
        - "src/server/generationReceipts.ts:buildHandoff"
        - "src/server/generationReceipts.ts:buildRerollHandoff"
        - "src/server/lineageTaskRoutes.ts:registerLineageTaskRoutes"
      facts:
        - "Branch and reroll prompt ownership must remain distinct because both states can exist independently and use different import semantics."
        - "The existing notes columns can provide backward-compatible storage, while explicit prompt aliases in typed projections can make the product contract unambiguous without a migration."
        - "The safest vertical slice opens a prompt composer before creating either selection, persists the text through existing notes/task-instruction writes, renders a compact prompt affordance on each node, and pre-fills branch/reroll planners from the saved prompt."
        - "Codex can already discover and claim pending iterate/reroll tasks, but no repository code can wake or route a specific Codex desktop conversation."
        - "A direct Canvas action can safely create an inspectable planned generation job, but actual image generation must remain a Codex-side action until an authenticated task transport exists."
      contradictions:
        - "The current generated branch brief treats notes as a rationale and the planner requires a separate prompt, so saved intent is not yet the exact generation instruction end to end."
        - "The current reroll handoff tells the agent to ask for or use a target-specific prompt even though reroll notes/task instructions may already contain it."
      ambiguity_requiring_judge:
        - "Whether a direct Canvas action should stop at queueing the durable Lineage task, or additionally create a planned generation job immediately after an explicit preview/confirm step."
        - "Whether multiple branch sources should support distinct per-source prompts in one job or require one selected source per prompt for the first release."
      commands:
        - "rg and sed source inspection across Canvas, server storage, selection packet, task queue, and generation handoff contracts"
